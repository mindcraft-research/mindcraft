version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindcraft
      POSTGRES_USER: mindcraft
      POSTGRES_PASSWORD: mindcraft_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://mindcraft:mindcraft_dev@db:5432/mindcraft
      JWT_SECRET: dev_secret_change_in_production_64chars_minimum_abcdef1234567890
      PORT: 3002
      HOST: 0.0.0.0
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      EMAIL_FROM: "MindCraft <onboarding@resend.dev>"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
