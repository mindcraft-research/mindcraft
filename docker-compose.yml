services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindcraft}
      POSTGRES_USER: ${POSTGRES_USER:-mindcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please_change_me_dev_only}
    # Pas de mapping de port vers l'hôte : le backend rejoint la base via
    # le réseau interne Docker (host = "db", port = 5432). Cela évite tout
    # conflit avec un PostgreSQL déjà installé sur la machine du dev.
    # Pour brancher psql/DBeaver depuis l'hôte : décommentez les 2 lignes ci-dessous.
    # ports:
    #   - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindcraft}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindcraft}:${POSTGRES_PASSWORD:-please_change_me_dev_only}@db:5432/${POSTGRES_DB:-mindcraft}
      JWT_SECRET: ${JWT_SECRET:-please_change_me_dev_only_64chars_minimum_abcdef1234567890abcdef}
      PORT: 3002
      HOST: 0.0.0.0
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      EMAIL_FROM: "MindCraft <onboarding@resend.dev>"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
