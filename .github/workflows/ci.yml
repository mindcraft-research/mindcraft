name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ──────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mindcraft_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push schema to test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mindcraft_test
        run: npx prisma db push --skip-generate

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mindcraft_test
          JWT_SECRET: ci_test_secret_64chars_minimum_abcdef1234567890abcdef1234567890abc
          PORT: 3002
          HOST: 0.0.0.0
          NODE_ENV: test
          FRONTEND_URL: http://localhost:3000
        run: |
          node src/server.js &
          sleep 3

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mindcraft_test
        run: npm test

  # ── Frontend build ─────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3002
        run: npm run build

  # ── Build & push Docker images to Scaleway Registry ────
  build-images:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/mindcraft-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/mindcraft-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  # ── Redeploy Scaleway containers ───────────────────────
  deploy:
    needs: [build-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy containers
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
          BACKEND_ID: ${{ secrets.SCW_BACKEND_CONTAINER_ID }}
          FRONTEND_ID: ${{ secrets.SCW_FRONTEND_CONTAINER_ID }}
        run: |
          if [ -z "$BACKEND_ID" ] || [ -z "$FRONTEND_ID" ]; then
            echo "Container IDs not configured yet — skipping deploy"
            exit 0
          fi
          # Le script d'install officiel scaleway/scaleway-cli/scripts/get.sh
          # plante régulièrement avec « Unable to find the latest linux_amd64
          # release » même quand les releases existent côté GitHub. On télécharge
          # directement le binaire depuis l'URL stable de la dernière release.
          SCW_VERSION="2.56.0"
          curl -fsSL -o scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64"
          chmod +x scw
          ./scw container container deploy "$BACKEND_ID" region=fr-par
          ./scw container container deploy "$FRONTEND_ID" region=fr-par
