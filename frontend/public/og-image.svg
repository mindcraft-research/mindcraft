<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C17"/>
      <stop offset="100%" stop-color="#1a1d3a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.45)"/>
      <stop offset="60%" stop-color="rgba(99,102,241,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79,70,229,0.95)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,1)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="280" rx="500" ry="320" fill="url(#halo)"/>

  <!-- Logo en grand -->
  <g transform="translate(540, 130)">
    <rect width="120" height="120" rx="28" fill="url(#markBg)"/>
    <g transform="translate(20, 20) scale(3.33)">
      <path d="M9 3.5h6" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M10 3.5v5.8L4.8 19.1a1.6 1.6 0 0 0 1.45 2.4h11.5a1.6 1.6 0 0 0 1.45-2.4L14 9.3V3.5"
            stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.06)"/>
      <path d="M7.2 15.2 h9.6 l2.1 4 a1.6 1.6 0 0 1-1.45 2.3 h-11 a1.6 1.6 0 0 1-1.45-2.3 z" fill="rgba(255,255,255,0.5)"/>
      <circle cx="10.3" cy="20" r="0.95" fill="white"/>
      <circle cx="13.7" cy="20.5" r="0.7" fill="rgba(255,255,255,0.85)"/>
      <circle cx="11.8" cy="20.5" r="0.55" fill="rgba(255,255,255,0.8)"/>
    </g>
  </g>

  <!-- Nom -->
  <text x="600" y="320" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="80" font-weight="700" fill="white" letter-spacing="-1">MindCraft</text>

  <!-- Tagline -->
  <text x="600" y="390" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="400" fill="rgba(255,255,255,0.65)">L'expérimentation à la portée de toutes et de tous</text>

  <!-- Pills -->
  <g transform="translate(280, 460)" font-family="system-ui, sans-serif" font-size="20" font-weight="500">
    <g>
      <rect x="0" y="0" width="170" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
      <circle cx="22" cy="22" r="3.5" fill="rgba(165,180,252,0.95)"/>
      <text x="38" y="28" fill="rgba(255,255,255,0.85)">Questionnaires</text>
    </g>
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="155" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
      <circle cx="22" cy="22" r="3.5" fill="rgba(165,180,252,0.95)"/>
      <text x="38" y="28" fill="rgba(255,255,255,0.85)">Tâches comp.</text>
    </g>
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="160" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
      <circle cx="22" cy="22" r="3.5" fill="rgba(165,180,252,0.95)"/>
      <text x="38" y="28" fill="rgba(255,255,255,0.85)">Physiologie</text>
    </g>
    <g transform="translate(545, 0)">
      <rect x="0" y="0" width="155" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
      <circle cx="22" cy="22" r="3.5" fill="rgba(165,180,252,0.95)"/>
      <text x="38" y="28" fill="rgba(255,255,255,0.85)">Open Science</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="585" text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="18" fill="rgba(255,255,255,0.35)" letter-spacing="2">mindcraft-research.fr  ·  Open source &amp; gratuit</text>
</svg>
